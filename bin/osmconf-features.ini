# GDAL OSM driver config for the OSM features other than buildings in the live fetch (PLAN 4.7):
# default osmconf.ini plus area:highway as an area key, and the class and level tags as
# attributes. bin/import-datasets.sh loads lines and multipolygons with it into live_features.
# Kept apart from osmconf-buildings.ini: a tag made an attribute there leaves other_tags, which
# 110 reads to tell tagged Live buildings.

closed_ways_are_polygons=aeroway,amenity,area:highway,boundary,building,building:part,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform
attribute_name_laundering=no

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,highway,railway,waterway,tunnel,bridge,covered,layer,indoor,location
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[multipolygons]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type,building,building:part,highway,area:highway,railway,waterway,natural,leisure,amenity,landuse,tunnel,bridge,covered,layer,indoor,location
ignore=

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
